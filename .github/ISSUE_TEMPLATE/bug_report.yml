name: Bug report
description: Something in bxc does not work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: CLI version
      description: Output of `bxc --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and Node.js version
      placeholder: macOS 15 arm64, Node.js 22
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: What you ran
      description: Remove API keys, tokens and anything else private.
      render: shell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: Include the full error message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
