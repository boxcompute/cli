name: Feature request
description: A new command, flag or behaviour for bxc.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The task, and where the CLI gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like
      description: The command or flag you have in mind, with an example.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead today
