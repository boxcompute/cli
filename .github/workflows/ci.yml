name: Validate CLI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate CLI package
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Require a release version for distributable changes
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node scripts/validate-release-change.mjs "$BASE_SHA"

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate source and package
        run: |
          bun run typecheck
          bun test
          bun run lint
          bun run build
          npm pack --dry-run

  compatibility:
    name: Node ${{ matrix.node }} package smoke test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Build and smoke-test the packed CLI
        run: |
          bun install --frozen-lockfile
          package_file="$(npm pack --silent)"
          npm install --global --ignore-scripts --prefix "$RUNNER_TEMP/boxcompute-cli" "./$package_file"
          actual="$($RUNNER_TEMP/boxcompute-cli/bin/bxc --version)"
          expected="$(node --print "require('./package.json').version")"
          test "$actual" = "$expected"
